[build-system]
requires = ["setuptools==69.5.1", "wheel==0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-pricer"
version = "0.6.0"
description = "Versioned reference pricing and research tooling for structured products"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==1.26.4",
]

[project.urls]
Repository = "https://github.com/aish21/ml-pricer"

[project.optional-dependencies]
api = [
    "fastapi==0.115.14",
    "pandas==2.2.2",
    "pydantic==2.6.4",
    "requests==2.34.2",
    "scipy==1.13.0",
    "uvicorn[standard]==0.30.0",
    "yfinance==1.5.1",
]
frontend = [
    "pandas==2.2.2",
    "plotly==5.19.0",
    "pyarrow==21.0.0",
    "requests==2.34.2",
    "streamlit==1.59.0",
]
surrogate = [
    "joblib==1.4.2",
    "lightgbm==4.2.0",
    "scikit-learn==1.4.2",
]
training = [
    "joblib==1.4.2",
    "lightgbm==4.2.0",
    "optuna==3.6.1",
    "pandas==2.2.2",
    "scikit-learn==1.4.2",
    "scipy==1.13.0",
    "tqdm==4.66.2",
]
research = [
    "catboost==1.2.2",
    "torch==2.7.0",
    "xgboost==3.2.0",
]
test = [
    "black==24.8.0",
    "build==1.2.1",
    "httpx==0.27.0",
    "pytest==8.2.0",
    "ruff==0.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "src*"]
exclude = ["notebooks*", "unittests*"]

[tool.pytest.ini_options]
testpaths = ["unittests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["notebooks", "final", "data"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
