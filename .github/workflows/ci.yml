name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tested dependency groups
        run: python -m pip install --upgrade pip && python -m pip install -e ".[api,frontend,training,test]"
      - name: Static checks
        run: |
          python -m black --check app src unittests
          python -m ruff check app src/final unittests
      - name: Unit and integration tests
        run: python -m pytest -q
      - name: Build package
        run: python -m build

  containers:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build production images
        run: docker compose build
      - name: Verify backend market-data runtime
        run: docker compose run --rm --no-deps backend python -c "import importlib.util, scipy, yfinance; import app.services.research_market_data, app.services.risk_service, app.services.surrogate_monitoring, app.services.surrogate_service, src.final.expanded_shadow_campaign; from app.services.expanded_shadow_service import get_expanded_shadow_status; assert importlib.util.find_spec('joblib') is None; assert importlib.util.find_spec('lightgbm') is None; assert all(item['artifact_available'] for item in get_expanded_shadow_status()['products'].values())"
