name: ml-pricer

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ml-pricer-backend:latest
    environment:
      MODEL_RESULTS_DIR: /srv/app/final/results
      MODEL_HISTORY_FILE: /srv/app/data/pricing_history.csv
      MARKET_SNAPSHOT_STORE_FILE: /srv/app/data/market_snapshots.sqlite3
      PHOENIX_SURROGATE_DIR: /srv/app/data/surrogates/phoenix-price-first-v1/artifacts
      PHOENIX_SURROGATE_SHADOW_ENABLED: ${PHOENIX_SURROGATE_SHADOW_ENABLED:-true}
      PHOENIX_SURROGATE_ALLOW_UNAPPROVED: ${PHOENIX_SURROGATE_ALLOW_UNAPPROVED:-false}
      PHOENIX_SURROGATE_TELEMETRY_ENABLED: ${PHOENIX_SURROGATE_TELEMETRY_ENABLED:-true}
      PHOENIX_SURROGATE_TELEMETRY_DB: /srv/app/data/surrogate_shadow_observations.sqlite3
      PHOENIX_SURROGATE_TELEMETRY_MAX_ROWS: ${PHOENIX_SURROGATE_TELEMETRY_MAX_ROWS:-100000}
      PHOENIX_V3_SHADOW_ENABLED: ${PHOENIX_V3_SHADOW_ENABLED:-false}
      PHOENIX_V3_SHADOW_SAMPLE_RATE: ${PHOENIX_V3_SHADOW_SAMPLE_RATE:-0}
      BRC_V1_SHADOW_ENABLED: ${BRC_V1_SHADOW_ENABLED:-false}
      BRC_V1_SHADOW_SAMPLE_RATE: ${BRC_V1_SHADOW_SAMPLE_RATE:-0}
      EXPANDED_SURROGATE_TIMEOUT_MS: ${EXPANDED_SURROGATE_TIMEOUT_MS:-25}
      EXPANDED_SURROGATE_TELEMETRY_ENABLED: ${EXPANDED_SURROGATE_TELEMETRY_ENABLED:-false}
      EXPANDED_SURROGATE_TELEMETRY_DB: /srv/app/data/expanded_shadow_observations.sqlite3
      EXPANDED_SURROGATE_TELEMETRY_MAX_ROWS: ${EXPANDED_SURROGATE_TELEMETRY_MAX_ROWS:-100000}
    volumes:
      - ./final/results:/srv/app/final/results:ro
      - ./data:/srv/app/data:rw
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ml-pricer-frontend:latest
    environment:
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:8501"
    restart: unless-stopped
