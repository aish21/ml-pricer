services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: ml-pricer-backend:latest
    environment:
      MODEL_RESULTS_DIR: /srv/app/final/results
      MODEL_HISTORY_FILE: /srv/app/data/pricing_history.csv
    volumes:
      - ./final/results:/srv/app/final/results:ro
      - ./data:/srv/app/data:rw
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: ml-pricer-frontend:latest
    environment:
      API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:8501"
    restart: unless-stopped
